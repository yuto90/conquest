name: Deploy Web

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web and deploy to Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install Function dependencies
        run: npm ci --ignore-scripts

      - name: Check Function formatting
        run: npm run format

      - name: Typecheck Function
        run: npm run typecheck

      - name: Test Function
        run: npm test

      - name: Read Flutter version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          flutter_version="$(jq -er '.flutterSdkVersion | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .fvm/fvm_config.json)"
          [[ "$flutter_version" == "3.44.8" ]] || {
            echo "::error::.fvm/fvm_config.json must select Flutter 3.44.8 for Web builds"
            exit 1
          }
          echo "flutter_version=$flutter_version" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter from FVM config
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate fvm 3.2.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm flutter pub get

      - name: Check Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          format_check=(fvm dart format --output=none --set-exit-if-changed lib test integration_test)
          echo "Dart format check: ${format_check[*]}"
          echo "To format locally: fvm dart format lib test integration_test"
          "${format_check[@]}"

      - name: Analyze
        run: fvm flutter analyze

      - name: Test
        run: fvm flutter test

      - name: Build web
        run: fvm flutter build web --release --base-href /

      - name: Build Vercel Output API artifact
        run: npm run build:vercel-output

      - name: Measure release Web sizes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          sum_bytes() {
            find "$1" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }'
          }

          sum_font_bytes() {
            find "$1/assets/assets/fonts" -type f \( -name '*.ttf' -o -name '*.otf' \) \
              -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }'
          }

          current_web_bytes="$(sum_bytes build/web)"
          current_font_bytes="$(sum_font_bytes build/web)"
          baseline_dir="$(mktemp -d)"
          trap 'rm -rf "$baseline_dir"' EXIT

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
          (
            cd "$baseline_dir"
            fvm flutter pub get
            fvm flutter build web --release --base-href /
          )

          baseline_web_bytes="$(sum_bytes "$baseline_dir/build/web")"
          baseline_font_bytes="$(sum_font_bytes "$baseline_dir/build/web")"
          {
            echo "## Release Web size comparison"
            echo
            echo "| Build | UI font assets | build/web total |"
            echo "| --- | ---: | ---: |"
            echo "| Base ${BASE_SHA:0:12} | ${baseline_font_bytes} bytes | ${baseline_web_bytes} bytes |"
            echo "| PR ${HEAD_SHA:0:12} | ${current_font_bytes} bytes | ${current_web_bytes} bytes |"
            echo
            echo "UI font assets include the registered TTF/OTF files under assets/assets/fonts."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Skip Vercel deploy
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::notice::Vercel secrets are not configured; built the prebuilt artifact without deploying."

      - name: Deploy to Vercel
        id: deploy
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          extra=(--target=preview)
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            extra=(--prod)
          fi
          url="$(npx --no-install vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" "${extra[@]}")"
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_STEP_SUMMARY"
